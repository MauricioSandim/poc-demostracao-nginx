version: '3'

services:

  nginx:
    container_name: "nginx"
    image: nginx:latest
    ports:
      - "9753:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3

  app1:
    container_name: "app1"
    image: python:3.12
    command: sh -c "pip install flask && python /app/app.py"
    volumes:
      - ./infra/server1:/app

  app2:
    container_name: "app2"
    image: python:3.12
    command: sh -c "pip install flask && python /app/app.py"
    volumes:
      - ./infra/server2:/app

  app3:
    container_name: "app3"
    image: python:3.12
    command: sh -c "pip install flask && python /app/app.py"
    volumes:
      - ./infra/server3:/app